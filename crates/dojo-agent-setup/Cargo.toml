[package]
name = "dojo-agent-setup"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Plan and manage Dojo desktop access for coding agents"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
jsonc-parser = { version = "0.33", features = ["cst", "serde_json"] }
toml_edit = "0.25"
serde_yaml_ng = "0.10"
include_dir = "0.7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "dojo-agent-setup"
path = "src/bin/dojo-agent-setup.rs"

[package]
name = "dojo-accessibility"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
dojo-cua-primitives = { path = "../dojo-cua-primitives" }
serde_json = "1"
atspi-common = "0.13"
serde = { version = "1", features = ["derive"] }
zbus = "5.19"
tokio = { version = "1", features = ["rt", "time", "macros"] }

[dev-dependencies]
zbus = { version = "5.19", features = ["p2p"] }
tempfile = "3"

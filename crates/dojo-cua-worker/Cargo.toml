[package]
name = "dojo-cua-worker"
version = "0.1.0"
edition = "2021"
autobins = false
license = "MIT"

[workspace]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=1.0.69"
tokio = { version = "=1.53.2", features = ["rt"] }
uuid = { version = "=1.27.0", features = ["v4"] }

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "time"] }

[features]
test-fixture = []

[[bin]]
name = "dojo-cua-worker-fixture"
path = "src/bin/fixture.rs"
required-features = ["test-fixture"]

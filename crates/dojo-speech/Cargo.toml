[package]
name = "dojo-speech"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Dojo's local capture and transcription core, extracted from Hex"

[features]
default = ["vulkan"]
vulkan = ["transcribe-cpp/vulkan"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6.5"
cpal = "0.18.2"
ctrlc = "3.5.2"
dirs = "7.0.0"
fs2 = "0.4.3"
hound = "3.5.1"
rubato = "5.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tracing = "0.1"
transcribe-cpp = "=0.2.4"


# Model verification hashes gigabytes; debug SHA-256 delays speech readiness.
[profile.dev.package.sha2]
opt-level = 3

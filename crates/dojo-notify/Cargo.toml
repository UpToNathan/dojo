[package]
name = "dojo-notify"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Dojo's notices: what happened on this machine, handed to the notification service"

[workspace]

[dependencies]
zbus = "=5.19.0"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "dojo-notify"
path = "src/bin/dojo-notify.rs"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true

[package]
name = "dojo-mesh"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Dojo's view of the nodes it can reach: who belongs to the mesh and whether it is healthy"

[workspace]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[dev-dependencies]
base64 = "0.22"
sha2 = "0.10"

[[bin]]
name = "dojo-mesh"
path = "src/bin/dojo-mesh.rs"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true

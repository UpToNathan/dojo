[package]
name = "dojo-icon-cache"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]

[dependencies]
hex = "0.4"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
tempfile = "3"
libc = "0.2"
freedesktop-icons = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

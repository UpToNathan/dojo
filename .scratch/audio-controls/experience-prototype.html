<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;color:var(--foreground,#ddd)}button{font:inherit;cursor:pointer;color:inherit}h2{font-size:22px;font-weight:550;margin:0 0 8px}p{color:var(--muted-foreground,#999);line-height:1.6} .desktop{position:relative;height:340px;background:#17191c;border:12px solid #24272c;border-top-width:42px;border-radius:22px;margin:22px 0;overflow:visible;color:#e1e4e8}.workspace{padding:28px;color:#666c77;font:12px monospace}.window{margin-top:16px;border:1px solid #30353d;border-radius:12px;padding:22px;background:#1d2025;max-width:360px;height:170px}.line{height:5px;background:#373d46;border-radius:5px;margin:12px 0}.corner{position:absolute;right:8px;top:-36px;display:flex;align-items:center;gap:14px;height:28px}.icons{display:flex;gap:12px;color:#b8bec7;font-size:14px;white-space:nowrap}.audio{display:flex;align-items:center;gap:8px;border:0;border-radius:18px;background:transparent;padding:5px 9px;position:relative;transition:background .2s}.audio:hover,.audio:focus-within{background:#363b43}.speaker{border:0;background:none;padding:0;width:22px;height:22px}.speaker svg{width:18px;height:18px}.track{width:0;opacity:0;overflow:hidden;transition:width .28s cubic-bezier(.2,.8,.2,1),opacity .2s;display:flex;align-items:center;gap:8px}.audio:hover .track,.audio:focus-within .track,.audio.open .track{width:138px;opacity:1}input{accent-color:#c7dbb7;width:96px;cursor:pointer}.level{font-size:11px;color:#c7dbb7;font-variant-numeric:tabular-nums;min-width:23px}.mark{height:3px;width:22px;background:linear-gradient(to right,#c7dbb7 64%,#555 64%);border-radius:5px}.panel{display:none;position:absolute;right:0;top:37px;width:260px;background:#282d34;border:1px solid #424951;border-radius:18px;padding:18px;box-shadow:0 15px 45px #0006;transform-origin:top right;animation:enter .22s ease-out;z-index:2}.panel.show{display:block}@keyframes enter{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}.panel input{width:100%;margin:16px 0}.device{width:100%;border:0;background:#343b43;border-radius:10px;padding:10px;text-align:left;margin:4px 0;font-size:12px}.device.active{color:#c7dbb7;background:#3b453d}.dial{display:none;width:30px;height:30px;border-radius:50%;border:3px solid #c7dbb7;background:#323a32;align-items:center;justify-content:center;font-size:9px;cursor:ew-resize;touch-action:none}.switcher{display:flex;align-items:center;justify-content:center;gap:18px;margin:18px auto;width:max-content;border:1px solid var(--border,#444);border-radius:24px;padding:8px 16px}.switcher button{border:0;background:none;padding:4px 12px}.notes{display:grid;grid-template-columns:1fr 1fr;gap:20px}.notes p{margin:6px 0}#state{font:11px monospace;color:var(--muted-foreground,#999);margin-top:16px}.hint{position:absolute;bottom:18px;left:18px;color:#828995;font-size:11px}.b .dial{display:flex}.b .mark,.b .track{display:none}.c .mark,.c .track{display:none}@media(max-width:480px){.notes{grid-template-columns:1fr}.icons{gap:7px}.corner{gap:6px}.desktop{height:310px}.workspace{padding:14px}}
</style></head><body><h2>Audio, within reach</h2><p id="intro"></p><div class="desktop a" id="desktop"><div class="corner"><div class="audio" id="audio"><button class="speaker" id="speaker" aria-label="Open audio controls"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M11 5 6 9H3v6h3l5 4Z"/><path d="M15 8q5 4 0 8M18 5q8 7 0 14"/></svg></button><div class="mark" id="mark"></div><div class="track"><input id="inline" type="range" min="0" max="100" value="64" aria-label="Volume"><span class="level" id="level">64</span></div><div class="dial" id="dial" title="Drag horizontally to adjust volume">64</div><div class="panel" id="panel"><div style="display:flex;justify-content:space-between"><span>Audio</span><button id="mute" style="border:0;background:none;font-size:12px">Mute</button></div><input id="expanded" type="range" min="0" max="100" value="64" aria-label="Output volume"><div style="font-size:10px;color:#969faa;margin-bottom:8px">PLAY THROUGH</div><button class="device active">✓ Studio speakers</button><button class="device">Headphones</button><button class="device">HDMI display</button></div></div><div class="icons"><span>☼</span><span>◈</span><span>▣</span><span style="font-size:11px">82%</span></div></div><div class="workspace">DOJO / WORKSPACE<div class="window"><span style="color:#a5adbb">The workspace stays visible.</span><div class="line" style="width:80%"></div><div class="line" style="width:55%"></div><div class="line" style="width:65%"></div></div></div><div class="hint" id="hint"></div></div><div class="switcher"><button id="prev" aria-label="Previous concept">←</button><span id="name"></span><button id="next" aria-label="Next concept">→</button></div><div class="notes"><div><strong id="title"></strong><p id="description"></p></div><div><strong>Motion and control</strong><p id="motion"></p></div></div><div id="state"></div><p style="font-size:11px">Experience draft. Audio and devices are simulated. Corner icons are placeholders for Dojo's existing controls.</p><script>
const variants=[['A · Expanding slider','A quiet level mark becomes a slider as your pointer reaches it.','Recommended starting point','Hover or focus to reveal the slider. Scroll over it to adjust. Click the speaker for output selection.','The slider grows leftward in 220 ms, keeping the corner icons still. It stays open while you drag. No continuous animation at rest.','Hover over audio. Drag or scroll. Click the speaker.'],['B · Tactile dial','A small dial keeps volume visible without opening a panel.','For frequent adjustments','Drag the dial left or right. Scroll for small changes. Click the speaker to pick an output.','The value follows your hand immediately. A native version would show a short arc and offer larger movement with Shift.','Drag the round level indicator left or right.'],['C · Audio panel','One speaker opens a focused panel beneath the frame.','For explicit controls','Click the speaker to open volume, mute and output selection together. Choose a device without leaving the workspace.','The panel appears from its anchor in 180 ms. Escape or a click outside closes it. Reduced motion would remove translation.','Click the speaker to open the audio panel.']];let v=0,volume=64,muted=false,device='Studio speakers';const $=x=>document.getElementById(x);function state(){ $('inline').value=$('expanded').value=volume;$('level').textContent=$('dial').textContent=muted?'0':volume;$('mark').style.background=`linear-gradient(to right,#c7dbb7 ${muted?0:volume}%,#555 0)`;$('speaker').style.opacity=muted?.45:1;$('mute').textContent=muted?'Unmute':'Mute';$('state').textContent=`Draft state · ${variants[v][0]} · volume ${volume}% · ${muted?'muted':'audible'} · ${device}`;}function setVariant(n){v=(n+3)%3;$('desktop').className='desktop '+['a','b','c'][v];$('panel').classList.remove('show');['name','intro','title','description','motion','hint'].forEach((id,i)=>$(id).textContent=variants[v][i]);const url=new URL(location.href);url.searchParams.set('variant',['A','B','C'][v]);try{history.replaceState(null,'',url)}catch{}state()}$('prev').onclick=()=>setVariant(v-1);$('next').onclick=()=>setVariant(v+1);$('speaker').onclick=()=> $('panel').classList.toggle('show');$('mute').onclick=()=>{muted=!muted;state()};for(const id of ['inline','expanded'])$(id).oninput=e=>{volume=+e.target.value;muted=false;state()};$('audio').onwheel=e=>{e.preventDefault();volume=Math.max(0,Math.min(100,volume+(e.deltaY<0?2:-2)));muted=false;state()};document.querySelectorAll('.device').forEach(b=>b.onclick=()=>{document.querySelectorAll('.device').forEach(x=>{x.classList.remove('active');x.textContent=x.textContent.replace('✓ ','')});b.classList.add('active');device=b.textContent;b.textContent='✓ '+device;state()});$('dial').onpointerdown=e=>{const start=e.clientX,initial=volume;$('dial').setPointerCapture(e.pointerId);$('dial').onpointermove=m=>{volume=Math.max(0,Math.min(100,Math.round(initial+(m.clientX-start)/2)));muted=false;state()};$('dial').onpointerup=()=> $('dial').onpointermove=null};document.addEventListener('click',e=>{if(!$('audio').contains(e.target))$('panel').classList.remove('show')});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('panel').classList.remove('show');if(e.target.matches('input,button'))return;if(e.key==='ArrowLeft')setVariant(v-1);if(e.key==='ArrowRight')setVariant(v+1)});setVariant(Math.max(0,['A','B','C'].indexOf(new URL(location.href).searchParams.get('variant'))));console.log('Audio prototype ready: three variants, simulated volume and output selection.');
</script></body></html>

# Tracked bang list for the launcher (src/launcher_core/bangs.rs embeds this file).
#
# Every search `url` was requested with a test query on 2026-10-24. Comments mark entries that
# answered curl with 403, a captcha or a login wall; those could not be checked further.
# `{}` is the query and appears exactly once, after the host. `home` is what a bare bang opens;
# it defaults to the template's scheme and host. Entries with best_effort = true are sites that may
# stop honouring the query.
# The user file ~/.config/dojo/bangs.toml uses the same format and wins on a clash.

default_engine = "ddg"


# Search engines

[[bang]]
trigger = "g"
name = "Google"
url = "https://www.google.com/search?q={}"

[[bang]]
trigger = "ddg"
name = "DuckDuckGo"
url = "https://duckduckgo.com/?q={}"

[[bang]]
trigger = "b"
name = "Bing"
url = "https://www.bing.com/search?q={}"

[[bang]]
trigger = "brave"
name = "Brave Search"
url = "https://search.brave.com/search?q={}"

# redirects to the login page without a Kagi session
[[bang]]
trigger = "kagi"
name = "Kagi"
url = "https://kagi.com/search?q={}"

[[bang]]
trigger = "gi"
name = "Google Images"
url = "https://www.google.com/search?tbm=isch&q={}"
home = "https://images.google.com/"



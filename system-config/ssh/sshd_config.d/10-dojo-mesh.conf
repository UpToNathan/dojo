# Dojo mesh: members reach this machine with public keys and nothing else.
#
# Installed by scripts/install-mesh-sshd.sh as a root-owned copy. It sorts before the distribution's
# own drop-ins because sshd keeps the first value it reads for each setting.
#
# Passwords never open a session over SSH, and neither does root: root work is `sudo` after a
# member's key has opened a session as an ordinary user (docs/mesh.md).
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
AuthenticationMethods publickey

# A mesh connection needs a command channel and nothing else carried along with it.
AllowAgentForwarding no
X11Forwarding no
PermitTunnel no

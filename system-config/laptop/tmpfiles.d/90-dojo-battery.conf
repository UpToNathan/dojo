# Keep the battery between 75% and 80% charge: lithium cells wear faster at full charge. The
# firmware stores the thresholds, so they hold across suspend and power cycles. Lines for a
# battery without threshold support are skipped. To charge fully for a trip, write 100 to
# /sys/class/power_supply/BAT0/charge_control_end_threshold until the next boot, or change 80
# below. Start threshold first, so it never exceeds the stop threshold.
w /sys/class/power_supply/BAT0/charge_control_start_threshold - - - - 75
w /sys/class/power_supply/BAT0/charge_control_end_threshold - - - - 80

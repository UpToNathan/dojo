# Installed only on machines with a battery (scripts/install-system-config.sh).
# Arch Wiki, Power management: "Disabling NMI watchdog" and "Writeback Time".
kernel.nmi_watchdog = 0
# Batch disk writes into 60 second flushes instead of 5. Up to a minute of unsynced writes can be
# lost on a crash or power cut; anything that calls fsync (databases, git, journald) is unaffected.
vm.dirty_writeback_centisecs = 6000

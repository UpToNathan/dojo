# The unprivileged user that runs the login screen's Niri and dojo-greeter.
# No home, no login shell. It joins no device groups: the greeter session (pam_systemd class=greeter,
# on the seat's VT) lets logind hand the GPU and input devices to its compositor, as it does for any
# graphical session. If a host proves otherwise, add "m dojo-greeter video" (or input, render) here.
u dojo-greeter - "Dojo login screen" - /usr/bin/nologin


build-users-group = nixbld
experimental-features = nix-command flakes
max-jobs = 4
# An unreachable cache host (laptop off the tailnet) must cost seconds, not the default 300.
connect-timeout = 5

extra-substituters = https://walker-git.cachix.org
extra-trusted-public-keys = walker-git.cachix.org-1:vmC0ocfPWh0S/vRAQGtChuiZBTAe4wiKDeyyXM0/7pM=

# Mesh peers that offer a Nix cache, and the keys their caches are signed with, as approved by
# scripts/update-nix-cache.sh. Absent until that script has run; Nix skips a missing !include.
!include dojo-cache.conf

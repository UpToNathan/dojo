[package]
name = "hokum"
version = "0.1.2"
edition = "2024"
license = "MIT"
description = "Hokum (hokum.app): a freedesktop notification daemon for Wayland, drawn with Rune."
homepage = "https://hokum.app"
repository = "https://github.com/anomalyco/hokum"

[dependencies]
rune = { path = "../rune/crates/rune" }
rune-kit = { path = "../rune/crates/rune-kit" }
rune-theme-opencode = { path = "../rune/themes/opencode" }
zbus = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
kdl = "6"
rhai = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
codegen-units = 16

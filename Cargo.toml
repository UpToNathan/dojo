[package]
name = "dojo"
version = "0.1.0"
edition = "2024"
default-run = "dojo"
license = "GPL-3.0-or-later"

[dependencies]
dojo-native-seat = { path = "crates/dojo-native-seat" }
dojo-cua-worker = { path = "crates/dojo-cua-worker" }
gpui = { path = "vendor/zed/crates/gpui", default-features = false }
gpui_platform = { path = "vendor/zed/crates/gpui_platform", default-features = false, features = ["wayland"] }
niri-ipc = { path = "vendor/niri/niri-ipc" }
dojo-computer = { path = "crates/dojo-computer" }
dojo-external-admission = { path = "crates/dojo-external-admission", default-features = false, features = ["atspi-transport"] }
dojo-browser-control = { path = "crates/dojo-browser-control" }
dojo-computer-verification = { path = "crates/dojo-computer-verification" }
dojo-capture-wayland = { path = "crates/dojo-capture-wayland" }
dojo-accessibility = { path = "crates/dojo-accessibility" }
dojo-agent-setup = { path = "crates/dojo-agent-setup" }
dojo-icon-cache = { path = "crates/dojo-icon-cache" }
dojo-computer-recording = { path = "crates/dojo-computer-recording" }
dojo-cua-core = { package = "cua-driver-core", path = "vendor/cua/driver/crates/cua-driver-core", default-features = false, features = ["yaml"] }
dojo-cua-contract = { package = "cua-driver-contract", path = "vendor/cua/driver/crates/cua-driver-contract" }
async-trait = "=0.1.92"
uuid = { version = "=1.27.0", features = ["v4", "v5"] }
anyhow = "=1.0.104"
base64 = "=0.22.1"
tempfile = "=3.27.0"
libc = "=0.2.190"
sha2 = "=0.10.9"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=1.1.7"
zbus = "=5.19.0"
# Edge reservations talk to the compositor directly, without a GPU surface (src/edge_reservation.rs).
wayland-client = "=0.31.15"
wayland-protocols = { version = "=0.32.13", features = ["client"] }
wayland-protocols-wlr = { version = "=0.3.12", features = ["client"] }
freedesktop-desktop-entry = { version = "=0.8.3", default-features = false }
nucleo-matcher = "=0.3.1"
unicode-segmentation = "=1.13.3"
async-channel = "=2.5.0"
futures-lite = "=2.6.1"
rustix = { version = "=1.1.5", features = ["fs", "event"] }
freedesktop-icons = "=0.4.0"
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
zeroize = "=1.9.1"
# blocking 1.7.0 never retires idle pool threads, so each one wakes every 500 ms for the
# life of the process (smol-rs/blocking#81). zbus connects through this pool.
blocking = "=1.6.2"

[features]
# Lets dojo-lock-pam and dojo-dm-pam read service files from a private directory. Tests only; never in a release build.
fake-pam-stack = []
# Compiles session::action::RecordingRunner so tests and the nested Niri can record actions. Never in a release build.
record-session-actions = []

# Line tables keep backtraces readable at a fraction of full debug-info size.
[profile.dev]
debug = "line-tables-only"

# Window creation compiles shader pipelines. Keep this work optimized even
# while Dojo's own code retains a fast, debuggable development build.
[profile.dev.package.naga]
opt-level = 3

[profile.dev.package.wgpu-core]
opt-level = 3

[profile.dev.package.gpui_wgpu]
opt-level = 3

[dev-dependencies]
gpui = { path = "vendor/zed/crates/gpui", default-features = false, features = ["test-support"] }

[[bin]]
name = "dojo-agent-setup"
path = "crates/dojo-agent-setup/src/bin/dojo-agent-setup.rs"

[[bin]]
name = "dojo-computer-verification"
path = "crates/dojo-computer-verification/src/bin/dojo-computer-verification.rs"

[[bin]]
name = "dojo-computer-recording"
path = "crates/dojo-computer-recording/src/bin/dojo-computer-recording.rs"

[[bin]]
name = "dojo-accessibility-fixture"
path = "tools/accessibility/gpui_fixture.rs"

[[test]]
name = "lock_worker"
path = "tests/lock_worker.rs"
required-features = ["fake-pam-stack"]

[[test]]
name = "dm_pam"
path = "tests/dm_pam.rs"
required-features = ["fake-pam-stack"]

[[test]]
name = "dm_service"
path = "tests/dm_service.rs"
required-features = ["fake-pam-stack"]

[profile.dev.package.sha2]
opt-level = 3

[patch.crates-io]
accesskit_unix = { path = "vendor/accesskit-unix" }
